name: akwaba

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # Aucun port publié : seul le réseau Docker interne y accède.
    # Pour déboguer ponctuellement depuis l'hôte, décommenter (loopback uniquement) :
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Activés dans les phases suivantes ---
  # backend:    (Phase 1)   FastAPI
  # scheduler:  (Phase 5+)  APScheduler, même image que backend
  # web:        (Phase 11)  Nginx : SPA + proxy /api

volumes:
  pgdata:

networks:
  internal:
