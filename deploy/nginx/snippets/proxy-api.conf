# Proxy /api/* → backend:8000.
#
# Les en-têtes d'origine réseau sont RECONSTRUITS (jamais complétés) :
# une valeur envoyée par le navigateur est écrasée.
proxy_pass $akwaba_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto "https";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header Forwarded "";
# En-têtes d'identité ajoutés par tailscale serve : non utilisés par le backend,
# donc non transmis (aucune confiance implicite future).
proxy_set_header Tailscale-User-Login "";
proxy_set_header Tailscale-User-Name "";
proxy_set_header Tailscale-User-Profile-Pic "";
proxy_set_header Tailscale-Headers-Info "";
proxy_set_header Tailscale-App-Capabilities "";

proxy_redirect off;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

proxy_hide_header Cache-Control;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
add_header Cache-Control "no-store" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
