# En-têtes de sécurité des pages et fichiers statiques.
# Inclus dans CHAQUE location qui en a besoin (add_header n'est pas hérité
# dès qu'une location déclare son propre add_header).
#
# CSP : aucun script ni style inline, aucun eval, aucune ressource externe.
# require-trusted-types-for 'script' : innerHTML & co. sont interdits (Chromium) ;
# l'interface construit le DOM exclusivement avec createElement/textContent.
#
# Pas de HSTS : il s'appliquerait à tout l'hôte ubuntu.tail14614.ts.net,
# y compris l'application du Funnel (443), qui ne doit pas être modifiée.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
