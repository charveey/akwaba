# AKWABA — Nginx (Phase 11a) : frontend statique + reverse proxy /api.
#
# Exécuté SANS privilèges (utilisateur 101 de l'image officielle, cap_drop ALL,
# système de fichiers en lecture seule) : pas de directive `user`, tous les
# fichiers temporaires dans /tmp (tmpfs).

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    charset_types text/css text/plain application/javascript text/javascript image/svg+xml application/json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    autoindex off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # Ni cookie, ni jeton, ni en-tête dans le journal d'accès.
    log_format akwaba '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout akwaba;

    # Connexion : défense en profondeur (le backend verrouille déjà le compte après 5 échecs).
    limit_req_zone $binary_remote_addr zone=akwaba_login:1m rate=10r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/akwaba.conf;
}
