# AKWABA — serveur unique, écoute 8080 dans le conteneur.
# Publication hôte : 127.0.0.1:8080 uniquement (docker-compose.yml).
# Accès administrateur : https://ubuntu.tail14614.ts.net:8443 (tailscale serve) → 127.0.0.1:8080.
#
# Routage :
#   /              → index.html
#   /assets/*      → fichiers statiques (extensions autorisées uniquement)
#   /api/agent*    → 404 (l'agent parle directement au backend sur :8000)
#   /api/*         → backend:8000
#   /healthz       → 200 depuis 127.0.0.1 (healthcheck Docker), 404 sinon
#   tout le reste  → 404

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/akwaba;

    include /etc/nginx/snippets/upstream.conf;

    # IP réelle : seule la passerelle du réseau Docker `internal` (= l'hôte, donc
    # tailscaled qui sert :8443) peut la fournir, et seule la DERNIÈRE entrée de
    # X-Forwarded-For (ajoutée par tailscaled) est retenue. Le port 8080 n'étant
    # lié qu'à 127.0.0.1, aucun navigateur ne joint Nginx sans passer par tailscaled.
    set_real_ip_from 10.250.11.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET { deny all; }
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        limit_except GET { deny all; }
        location ~* \.(?:css|js|svg|png|ico|woff2)$ {
            include /etc/nginx/snippets/security-headers.conf;
            # Pas d'étape de build donc pas d'empreinte dans les noms :
            # revalidation systématique (ETag), téléchargement seulement si modifié.
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        return 404;
    }

    # L'API de l'agent n'est JAMAIS servie par Nginx.
    location = /api/agent {
        return 404;
    }
    location ^~ /api/agent/ {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=akwaba_login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /healthz {
        access_log off;
        if ($remote_addr != "127.0.0.1") {
            return 404;
        }
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
