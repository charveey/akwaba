[agent]
window_seconds = 60
interval_seconds = 60
use_sudo = yes
quiet = yes
exclude_sources = 100.85.214.5
spool_path = /var/lib/akwaba-agent/agent.db
min_replied_flows = 3
required_windows = 2
saturation_threshold = 0.8

